gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showDivergenceFromBaseBranch: arrowAndNumber

os:
  editPreset: nvim

git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --no-gitconfig

promptToReturnFromSubprocess: false

customCommands:
  - key: <c-a>
    context: global
    description: "Review current branch against its base (delta)"
    output: terminal
    command: |-
      base="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null)"; [ -z "$base" ] && for b in origin/main origin/master main master; do git rev-parse --verify --quiet "$b" >/dev/null 2>&1 && base="$b" && break; done; range="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"; git -c delta.paging=always diff "$range" HEAD
  - key: <c-n>
    context: global
    description: "Review current branch against its base (Neovim)"
    output: terminal
    command: |-
      base="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null)"; [ -z "$base" ] && for b in origin/main origin/master main master; do git rev-parse --verify --quiet "$b" >/dev/null 2>&1 && base="$b" && break; done; range="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"; git diff "$range" HEAD | nvim -R -c "setlocal buftype=nofile filetype=diff" -
  - key: <c-x>
    context: files, commitFiles
    description: "Review selected file against branch base (delta)"
    output: terminal
    command: |-
      base="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null)"; [ -z "$base" ] && for b in origin/main origin/master main master; do git rev-parse --verify --quiet "$b" >/dev/null 2>&1 && base="$b" && break; done; range="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"; git -c delta.paging=always diff "$range" HEAD -- {{.SelectedPath | quote}}
