# keyd layout. Chezmoi keeps the copy in ~/.config/keyd and
# run_onchange_after_keyd-layout.sh pushes it to /etc/keyd/default.conf, the only
# file keyd reads. "[ids] *" is not decoration: without it keyd silently ignores
# every device and remaps nothing. Needs kb_layout=us / kb_variant=altgr-intl in
# Hyprland (see dot_config/hypr/hyprland.conf), which is where the accented
# keysyms (aacute, ntilde, ...) come from - keyd only adds the two-key gestures.
#
# Why a daemon and not just a keymap: a dead key that is never composed has to be
# *flushed* (macOS: tilde then slash gives "~/"), while XKB *discards* an unclosed
# sequence. keyd solves it by typing the character and, if the next keystroke is an
# accent, deleting it again (oneshotm runs a macro before arming the layer). That
# costs one binding per accent instead of one per key on the keyboard.
#
# The one consequence: in an app where BackSpace is not "delete to the left" (vim
# normal mode, a pager) a gesture also sends a stray backspace. Accents typed in
# vim insert mode are unaffected.

[ids]
*

[global]
# Window (ms) in which Shift+` counts as one simultaneous press: that chord arms
# the tilde gesture. Press them further apart and you just type "~".
chord_timeout = 400

[main]
leftshift+grave = oneshotm(tilde, macro(leftshift+grave))
rightshift+grave = oneshotm(tilde, macro(leftshift+grave))
# ' writes itself and stays armed for a single keystroke: a vowel composes,
# anything else (don't, awk '{print $1}', '') is untouched. '' disarms.
apostrophe = oneshotm(acute, macro(apostrophe))
leftshift+apostrophe = macro(leftshift+apostrophe)
rightshift+apostrophe = macro(rightshift+apostrophe)
# Left Alt and Right Ctrl are XKB level 3 (RCtrl+a = aacute, RCtrl+n = ntilde);
# Right Alt is Super, the macOS command key.
leftalt = layer(altgr)
rightcontrol = layer(altgr)
rightalt = layer(meta)

# Shift+` has already written ~ by the time this runs, so the binding erases it and
# writes the enye. Shift on top gives Enye for free. Every other key after ~ is
# unbound and therefore normal: ~/path, ~1, ~user, ~~, ~ then Ctrl+C, arrows.
[tilde]
n = macro(backspace rightalt+n)

[acute]
a = macro(backspace rightalt+a)
e = macro(backspace rightalt+e)
i = macro(backspace rightalt+i)
o = macro(backspace rightalt+o)
u = macro(backspace rightalt+u)
apostrophe = clear()
