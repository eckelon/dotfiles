# display arrangement generated by nwg-displays
source = ~/.config/hypr/monitors.conf
input {
  kb_layout = us
  kb_variant = intl
  touchpad {
    natural_scroll = true
  }
}
general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
  col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
  col.inactive_border = rgba(313244aa)
}
decoration {
  rounding = 8
  shadow {
    enabled = false
  }
  # blur is the most expensive compositor pass; off for battery
  blur {
    enabled = false
  }
}
# 0.55+ animations rework ignores the hyprlang block form; dotted syntax works
animations:enabled = false

$mod = SUPER
$term = ghostty
bind = $mod, Return, exec, $term
bind = $mod, W, exec, helium
bind = $mod, R, exec, fuzzel
bindr = $mod, SUPER_L, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 0
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod_SHIFT, 1, movetoworkspace, 1
bind = $mod_SHIFT, 2, movetoworkspace, 2
bind = $mod_SHIFT, 3, movetoworkspace, 3
bind = $mod_SHIFT, 4, movetoworkspace, 4
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
exec-once = hyprshell run
bind = $mod_SHIFT, left,  workspace, e-1
bind = $mod_SHIFT, right, workspace, e+1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e set 5%-
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind   = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind   = $mod, L, exec, pidof hyprlock || hyprlock

# mod+? : toggle floating keybind cheat sheet
# ghostty 1.3 ignores --class on Wayland; --title survives map time -> rules match by title
bind = SUPER SHIFT, code:61, togglespecialworkspace, cheats
windowrule = float on, match:title cheatsheet
windowrule = size 620 560, match:title cheatsheet

# TUI popups from the bar (nmtui, bluetoothctl, powertop)
windowrule = float on, match:title dotfloat
windowrule = size 1000 620, match:title dotfloat
exec-once = [workspace special:cheats silent] ghostty --gtk-single-instance=false --title=cheatsheet -e ~/.config/hypr/cheatsheet.sh

exec-once = waybar
exec-once = nwg-dock-hyprland -d -p left -i 40 -c fuzzel -ml 6 -mt 10 -mb 10
exec-once = mako
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = [workspace 1 silent] $term
exec-once = [workspace 2 silent] helium
