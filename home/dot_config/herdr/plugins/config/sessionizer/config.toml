[projects]
roots = ["~/Development"]
git_only = true
depth = 3

[layout]
placement = "overlay"
focus = "claude"

[tabs.dev]
label = "dev"

[[tabs.dev.panes]]
id = "claude"
title = "claude"
command = "claude --continue || claude"

[[tabs.dev.panes]]
id = "lazygit"
from = "claude"
title = "lazygit"
split = "right"
ratio = 0.35
command = "lazygit"
