onboarding = false

[ui]
agent_panel_sort = "spaces"

[keys]
prefix = "ctrl+space"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "lazygit.toggle"
description = "Toggle lazygit sidebar"

[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "nvim.toggle"
description = "Toggle nvim sidebar"
